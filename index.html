<body>
<div class="app">
  <h1>다시 하면 되지 뭐!</h1>
  <div class="subtitle">퍼즐을 맞추고 함께 말해요</div>
  <div class="main">
    <section class="panel">
      <div class="panel-title">그림 맞추는 곳</div>
      <div id="board"><div id="hintImage"></div></div>
    </section>
    <section class="panel">
      <div class="panel-title">퍼즐 조각</div>
      <div id="pieceArea" class="piece-area"></div>
    </section>
  </div>
  <div class="buttons">
    <button onclick="say('다시 하면 되지 뭐!')">🔊 다시!</button>
    <button class="yellow" onclick="toggleHint()">👀 그림 보기</button>
    <button class="green" onclick="resetGame()">↻ 처음부터</button>
  </div>
  <div id="message" class="message">조각을 옮겨 보세요!</div>
  <div class="small">조각이 맞는 곳 근처에 가면 자동으로 붙어요.</div>
</div>
<script>
const board = document.getElementById('board');
const pieceArea = document.getElementById('pieceArea');
const message = document.getElementById('message');
const hintImage = document.getElementById('hintImage');
const COLS = 2, ROWS = 2, COUNT = 4;
let activePiece = null, offsetX = 0, offsetY = 0, completed = 0;

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
function cellW() { return board.clientWidth / COLS; }
function cellH() { return board.clientHeight / ROWS; }
function targetFor(index) { return { x: (index % COLS) * cellW(), y: Math.floor(index / COLS) * cellH() }; }

function clearBoard() {
  board.querySelectorAll('.slot,.piece').forEach(el => el.remove());
  board.prepend(hintImage);
}
function makeSlots() {
  for (let i=0;i<COUNT;i++) {
    const t = targetFor(i);
    const s = document.createElement('div');
    s.className = 'slot';
    s.style.left = t.x + 'px'; s.style.top = t.y + 'px';
    s.style.width = cellW() + 'px'; s.style.height = cellH() + 'px';
    board.appendChild(s);
  }
}
function makePiece(index) {
  const p = document.createElement('div');
  p.className = 'piece'; p.dataset.index = index;
  setPieceBackground(p, false);
  p.addEventListener('pointerdown', startDrag);
  return p;
}
function setPieceBackground(p, locked) {
  const i = Number(p.dataset.index);
  const w = locked ? cellW() : Math.min(230, Math.max(150, board.clientWidth * 0.34));
  const h = w * (cellH()/cellW());
  p.style.width = (locked ? cellW() : w) + 'px';
  p.style.height = (locked ? cellH() : h) + 'px';
  p.style.backgroundSize = (locked ? board.clientWidth : w * COLS) + 'px ' + (locked ? board.clientHeight : h * ROWS) + 'px';
  p.style.backgroundPosition = (-(i % COLS) * (locked ? cellW() : w)) + 'px ' + (-Math.floor(i/COLS) * (locked ? cellH() : h)) + 'px';
}
function init() {
  clearBoard(); makeSlots(); pieceArea.innerHTML=''; completed=0; hintImage.style.display='none';
  shuffle([0,1,2,3]).forEach(i => pieceArea.appendChild(makePiece(i)));
  message.textContent = '조각을 옮겨 보세요!';
}
function startDrag(e) {
  if (e.currentTarget.classList.contains('locked')) return;
  activePiece = e.currentTarget; activePiece.setPointerCapture(e.pointerId);
  const r = activePiece.getBoundingClientRect(); offsetX = e.clientX-r.left; offsetY = e.clientY-r.top;
  activePiece.style.position='fixed'; activePiece.style.left=r.left+'px'; activePiece.style.top=r.top+'px'; activePiece.style.zIndex=9999;
  document.addEventListener('pointermove', moveDrag); document.addEventListener('pointerup', endDrag, {once:true});
}
function moveDrag(e) { if(!activePiece) return; activePiece.style.left=(e.clientX-offsetX)+'px'; activePiece.style.top=(e.clientY-offsetY)+'px'; }
function endDrag() {
  if(!activePiece) return; document.removeEventListener('pointermove', moveDrag);
  const index = Number(activePiece.dataset.index), t = targetFor(index), br = board.getBoundingClientRect(), pr = activePiece.getBoundingClientRect();
  const pcx = pr.left + pr.width/2, pcy = pr.top + pr.height/2;
  const tcx = br.left + t.x + cellW()/2, tcy = br.top + t.y + cellH()/2;
  const dist = Math.hypot(pcx-tcx, pcy-tcy);
  if (dist < Math.max(cellW(), cellH()) * 0.72) {
    lockPiece(activePiece, t); completed++; 
    if (completed === COUNT) { say('완성! 해냈어! 다시 하면 되지 뭐!'); message.textContent='완성! 해냈어요!'; }
    else { say('해냈어!'); message.textContent='좋아요! 한 조각 성공!'; }
  } else {
    activePiece.style.position='relative'; activePiece.style.left='auto'; activePiece.style.top='auto'; activePiece.style.zIndex='auto';
    pieceArea.appendChild(activePiece); say('괜찮아. 다시 해보자!');
  }
  activePiece = null;
}
function lockPiece(p, t) {
  p.classList.add('locked'); p.style.position='absolute'; p.style.left=t.x+'px'; p.style.top=t.y+'px'; p.style.zIndex=5;
  setPieceBackground(p, true); board.appendChild(p);
}
function say(text) {
  message.textContent = text;
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.82; u.pitch=1.1; speechSynthesis.speak(u);
  }
}
function toggleHint() { hintImage.style.display = hintImage.style.display === 'block' ? 'none' : 'block'; say('그림을 보고 다시 해보자!'); }
function resetGame() { init(); say('다시 해보자!'); }
window.addEventListener('resize', init);
init();
</script>
